# Logs every query and the response it received, in text or JSON format, to
# STDOUT or to a file.

[listeners.local-udp]
address = "127.0.0.1:53"
protocol = "udp"
resolver = "query-log"

[groups.query-log]
type   = "query-log"
resolvers = ["cloudflare-dot"]
# Logs are written to STDOUT if blank, uncomment to write to a file instead. Under the
# systemd unit shipped with the packages this has to be a path below /var/log/routedns,
# see doc/overview.md#writable-paths.
# output-file = "/var/log/routedns/query.log"
output-format = "text" # or "json"
# Rotate the log file once it grows past this size (requires output-file). The
# active file is renamed to query.log.1, query.log.2, ... and numbering continues
# across restarts. Bare numbers are bytes; k/m/g/t (optionally with b/ib) are
# binary units. Unset means append without rotation.
# rotation-size = "100MB"

[resolvers.cloudflare-dot]
address = "1.1.1.1:853"
protocol = "dot"
